name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "player/**"
      - "backend/**"
      - ".github/workflows/build-player.yml"
      - ".github/workflows/events-feed.yml"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEY: ${{ secrets.NOVA_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Clé de release (optionnelle) : secrets NOVA_KEYSTORE_B64, NOVA_KEYSTORE_PASSWORD, NOVA_KEY_ALIAS, NOVA_KEY_PASSWORD.
      # Sans ces secrets, l'APK est signé avec la clé de dev du dépôt (tests uniquement).
      - name: Préparer la clé de release
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          KS_B64: ${{ secrets.NOVA_KEYSTORE_B64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "NOVA_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Compiler l'APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.1.${{ github.run_number }}
          NOVA_KEYSTORE_PASSWORD: ${{ secrets.NOVA_KEYSTORE_PASSWORD }}
          NOVA_KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS }}
          NOVA_KEY_PASSWORD: ${{ secrets.NOVA_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk nova-ui.apk

      - uses: actions/upload-artifact@v4
        with:
          name: nova-ui-apk
          path: nova-ui.apk

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Nova UI 0.1.${{ github.run_number }}
          files: nova-ui.apk
          make_latest: true
